    height:220px;border-radius:50%;background:rgba(217,164,65,0.14);}
  header.hero::after{content:"";position:absolute;left:-60px;bottom:-70px;width:180px;
    height:180px;border-radius:50%;background:rgba(193,98,45,0.18);}
  .eyebrow{font-size:13px;letter-spacing:0.16em;color:var(--gold);font-weight:700;
    margin:0 0 10px;position:relative;}
  h1{font-family:'Noto Serif KR',serif;font-weight:700;font-size:34px;margin:0 0 8px;
    position:relative;line-height:1.35;}
  .hero-sub{font-size:14px;color:#D9D2BF;margin:0;position:relative;line-height:1.7;}
  .hero-meta{display:flex;gap:24px;margin-top:20px;flex-wrap:wrap;position:relative;}
  .hero-meta span{font-size:12.5px;color:#EFE8D5;background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.16);border-radius:999px;padding:6px 14px;}
  .hero-meta b{color:var(--gold);font-weight:700;}
  .weekpick{position:relative;margin-bottom:14px;max-width:360px;}
  .weekpick-btn{display:flex;align-items:center;gap:10px;width:100%;background:var(--paper);
    border:1px solid var(--line);border-radius:14px;padding:11px 14px;cursor:pointer;
    font-family:inherit;text-align:left;transition:border-color .15s ease;}
  .weekpick-btn:hover{border-color:var(--line-strong);}
  .weekpick.open .weekpick-btn{border-color:var(--terracotta);}
  .wp-lbl{flex:none;font-size:11px;font-weight:700;color:var(--ink-soft);letter-spacing:.08em;
    background:var(--cream);border:1px solid var(--line);border-radius:999px;padding:3px 9px;}
  .wp-cur{flex:1;font-family:'Noto Serif KR',serif;font-weight:700;font-size:15px;color:var(--ink);}
  .wp-caret{flex:none;font-size:11px;color:var(--ink-soft);transition:transform .18s ease;}
  .weekpick.open .wp-caret{transform:rotate(180deg);}
  .weekpick-list{position:absolute;z-index:20;top:calc(100% + 6px);left:0;right:0;
    background:var(--paper);border:1px solid var(--line-strong);border-radius:14px;padding:6px;
    box-shadow:0 12px 30px rgba(44,38,32,.16);max-height:296px;overflow-y:auto;}
  .weekpick-list[hidden]{display:none;}
  .wp-opt{display:flex;align-items:baseline;justify-content:space-between;gap:10px;width:100%;

    font-family:inherit;text-align:left;color:var(--ink);}
  .wp-opt:hover{background:var(--cream);}
  .wp-opt .n{font-weight:700;font-size:13.5px;}
  .wp-opt .r{font-size:11px;color:var(--ink-soft);white-space:nowrap;}
  .wp-opt[aria-selected="true"]{background:var(--forest);color:#F7F1E4;}
  .wp-opt[aria-selected="true"] .r{color:#B9CBBE;}
  .tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:22px;}
  .tab{background:var(--paper);border:1px solid var(--line);border-radius:14px;
    padding:12px 8px 10px;text-align:center;cursor:pointer;transition:all .15s ease;user-select:none;}
  .tab:hover{border-color:var(--line-strong);}
  .tab .dow{font-family:'Noto Serif KR',serif;font-weight:700;font-size:15px;color:var(--ink);}
  .tab .ddate{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .tab.active{background:var(--forest);border-color:var(--forest);}
  .tab.active .dow{color:#F7F1E4;}
  .tab.active .ddate{color:#B9CBBE;}

  .tab.active.is-today::after{color:var(--gold);}

  .reactions{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
  .rx{display:inline-flex;align-items:center;gap:5px;background:var(--paper);
    border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer;
    font-family:inherit;font-size:12px;color:var(--ink-soft);line-height:1.6;
    transition:border-color .15s ease,background .15s ease,color .15s ease;}
  .rx:hover:not(:disabled){border-color:var(--line-strong);}
  .rx .e{font-size:13.5px;}
  .rx .c{font-weight:700;color:var(--ink);min-width:9px;text-align:right;

          ilpum:{main:"가쓰오갈릭함박스테이크",sub:["쌀밥&후리가케","일식장국/더운채소","일식양배추샐러드&드레싱","사각단무지/김치"],drink:"아이스티(복숭아맛)"}},
     f10:{lunchbox:["치킨데리야끼구이","미니돈까스","수수밥","얼큰해장국","오이양파무침","포기김치"],
          brunch:["클럽샌드위치","푸실리샐러드","오렌지망고드레싱","음료"],salad:["훈제오리단호박샐러드","오렌지망고드레싱","음료"]}},
    {date:"2026-09-04",dow:"금",ddate:"09.04",
     f20:{hansik:{main:"장조림버터밥",sub:["들깨미역국","오징어링튀김&탈탈소스","핫도그&설탕&케찹","샐러드&드레싱","김치"],drink:"ICE초코"},
          ilpum:{main:"매운해산물쌀국수",sub:["미니파인애플볶음밥","달콤팝춘권","알새우칩","샐러드&드레싱","김치"],drink:"ICE초코"}},
     f10:{lunchbox:["영콘소불고기","야채멘치까스","백미밥","시래기된장국","마늘쫑무침","포기김치"],
          brunch:["참치샌드위치","치즈스틱샐러드","오리엔탈드레싱","음료"],salad:["치즈함박고구마샐러드","오리엔탈드레싱","음료"]}}
  ]}
];
/* 메뉴 반응 설정 — 자세한 내용은 README-reactions.md 참고.
   mode:'local'    : 이 브라우저에만 저장. 남의 반응은 보이지 않음.
   mode:'supabase' : 모두가 같은 카운트를 봄. url/anonKey를 채우고 mode를 바꾸면 전환됨.
                     anonKey는 공개 배포용 키라 이 파일에 넣어도 됨(권한은 RLS로 제한). */
const RX_CFG={mode:'local',url:'',anonKey:''};
const RX_MSG={
  loadFail:'반응을 불러오지 못했습니다. 새로고침해 주세요.',
  saveFail:'반응 저장에 실패했습니다. 다시 눌러 주세요.',
  localOnly:'반응은 현재 이 브라우저에만 저장됩니다. 다른 사람의 반응은 아직 보이지 않습니다.'};
const RX_EMOJI=[{id:'good',e:'\u{1F44D}',label:'맛있어요'},
                {id:'yum', e:'\u{1F60B}',label:'또 먹고 싶어요'},
                {id:'meh', e:'\u{1F610}',label:'그저 그래요'}];
function rxBar(date,floor,corner){
  return `<div class="reactions" data-rxkey="${date}:${floor}:${corner}">`
    +RX_EMOJI.map(m=>`<button type="button" class="rx" data-emoji="${m.id}" disabled `
      +`aria-pressed="false" aria-label="${m.label}" title="${m.label}">`
      +`<span class="e">${m.e}</span><span class="c">&ndash;</span></button>`).join('')
    +`</div>`;}
function rxVoter(){let v=null;
  try{v=localStorage.getItem('rx-voter');}catch(e){}
  if(!v){v=(window.crypto&&crypto.randomUUID)?crypto.randomUUID()
      :'v'+Math.random().toString(36).slice(2)+Date.now().toString(36);
    try{localStorage.setItem('rx-voter',v);}catch(e){}}
  return v;}
const rxLocal={
  _read(k){try{return JSON.parse(localStorage.getItem(k))||{};}catch(e){return {};}},
  _write(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}},
  async counts(keys){const all=this._read('rx-counts'),mine=this._read('rx-mine'),out={};
    keys.forEach(k=>out[k]={counts:all[k]||{},mine:mine[k]||null});return out;},
  async vote(key,to){const all=this._read('rx-counts'),mine=this._read('rx-mine');
    const c=Object.assign({},all[key]),prev=mine[key]||null;
    if(prev)c[prev]=Math.max(0,(c[prev]||0)-1);
    if(to)c[to]=(c[to]||0)+1;
    all[key]=c;
    if(to)mine[key]=to;else delete mine[key];
    this._write('rx-counts',all);this._write('rx-mine',mine);}};
const rxSupa={
  _h(extra){return Object.assign({apikey:RX_CFG.anonKey,Authorization:'Bearer '+RX_CFG.anonKey,
    'Content-Type':'application/json'},extra||{});},
  async counts(keys){
    const list=keys.map(k=>'"'+k+'"').join(',');
    const r=await fetch(`${RX_CFG.url}/rest/v1/menu_reactions`
      +`?select=menu_key,emoji,voter&menu_key=in.(${list})`,{headers:this._h()});
    if(!r.ok)throw new Error('load '+r.status);
    const rows=await r.json(),me=rxVoter(),out={};
    keys.forEach(k=>out[k]={counts:{},mine:null});
    rows.forEach(row=>{const o=out[row.menu_key];if(!o)return;
      o.counts[row.emoji]=(o.counts[row.emoji]||0)+1;
      if(row.voter===me)o.mine=row.emoji;});
    return out;},
  async vote(key,to){const voter=rxVoter();
    if(!to){const r=await fetch(`${RX_CFG.url}/rest/v1/menu_reactions`
        +`?menu_key=eq.${encodeURIComponent(key)}&voter=eq.${encodeURIComponent(voter)}`,
        {method:'DELETE',headers:this._h()});
      if(!r.ok)throw new Error('delete '+r.status);return;}
    const r=await fetch(`${RX_CFG.url}/rest/v1/menu_reactions?on_conflict=menu_key,voter`,
      {method:'POST',headers:this._h({Prefer:'resolution=merge-duplicates'}),
       body:JSON.stringify({menu_key:key,voter,emoji:to})});
    if(!r.ok)throw new Error('save '+r.status);}};
function rxShared(){return RX_CFG.mode==='supabase'&&!!RX_CFG.url&&!!RX_CFG.anonKey;}
function rxStore(){return rxShared()?rxSupa:rxLocal;}
function rxPaint(bar,st){
  bar.querySelectorAll('.rx').forEach(btn=>{const id=btn.dataset.emoji,on=st.mine===id;
    btn.disabled=false;btn.classList.toggle('on',on);
    btn.setAttribute('aria-pressed',on?'true':'false');
    btn.querySelector('.c').textContent=st.counts[id]||0;});
  bar._rx=st;}
function rxNote(bar,msg){let n=bar.nextElementSibling;
  if(!n||!n.classList.contains('rx-note')){n=document.createElement('div');
    n.className='rx-note';bar.parentNode.insertBefore(n,bar.nextSibling);}
  n.textContent=msg;}
let rxSeq=0;
async function hydrateReactions(){
  const bars=[].slice.call(panelsEl.querySelectorAll('.reactions'));
  if(!bars.length)return;
  const seq=++rxSeq,keys=bars.map(b=>b.dataset.rxkey);
  let data;
  try{data=await rxStore().counts(keys);}
  catch(e){if(seq===rxSeq)bars.forEach(b=>rxNote(b,RX_MSG.loadFail));return;}
  if(seq!==rxSeq)return;
  bars.forEach(b=>rxPaint(b,data[b.dataset.rxkey]||{counts:{},mine:null}));}
const weekpick=document.getElementById('weekpick'),weekpickBtn=document.getElementById('weekpickBtn'),
  weekpickList=document.getElementById('weekpickList'),wpCur=document.getElementById('wpCur'),
  tabsEl=document.getElementById('tabs'),
  panelsEl=document.getElementById('panels'),rangePill=document.getElementById('rangePill');
let curWeek=0,curDay=0;
(function(){for(let w=0;w<WEEKS.length;w++)for(let d=0;d<WEEKS[w].days.length;d++)
  if(WEEKS[w].days[d].date===todayISO){curWeek=w;curDay=d;return;}
  curWeek=WEEKS.length-1;curDay=0;})();
function brand(s){return s&&s.label?`<span class="brand">${s.label}</span>`:'';}
function subBlock(s){return `<div class="menu-main">${s.main}</div>
  <div class="menu-sub">${s.sub.map(x=>`<span class="item">${x}</span>`).join('')}</div>
  ${s.drink?`<span class="drink">${s.drink}</span>`:''}`;}
function f20Block(f,date){
  if(f.holiday)return `<div class="no-service"><div class="big">${f.holiday}</div>운영하지 않습니다.</div>`;
  if(f.special)return `<div class="section"><span class="special-badge">${f.special.label}</span>${subBlock(f.special)}${rxBar(date,'f20','special')}</div>`;
  return `<div class="section"><div class="section-title">한식${brand(f.hansik)}</div>${subBlock(f.hansik)}${rxBar(date,'f20','hansik')}</div>
    <div class="divider"></div><div class="section"><div class="section-title">일품${brand(f.ilpum)}</div>${subBlock(f.ilpum)}${rxBar(date,'f20','ilpum')}</div>`;}
function f10Block(f,date){
  if(!f)return `<div class="no-service"><div class="big">미운영</div>공존 카페테리아는 이 날 운영하지 않습니다.</div>`;
  if(f.holiday)return `<div class="no-service"><div class="big">${f.holiday}</div>운영하지 않습니다.</div>`;
  const lb=f.lunchbox===null?`<div class="brunch-item" style="color:var(--ink-soft)">이 날은 도시락 미운영</div>`
    :`<div class="brunch-item">${f.lunchbox.join(' · ')}</div>${rxBar(date,'f10','lunchbox')}`;
  return `<div class="section"><div class="section-title">도시락</div>${lb}</div>
    <div class="divider"></div><div class="section"><div class="section-title">브런치</div><div class="brunch-item">${f.brunch.join(' · ')}</div>${rxBar(date,'f10','brunch')}</div>
    <div class="divider"></div><div class="section"><div class="section-title">샐러드</div><div class="salad-item">${f.salad.join(' · ')}</div>${rxBar(date,'f10','salad')}</div>`;}
function closeWeekpick(){weekpick.classList.remove('open');weekpickList.hidden=true;
  weekpickBtn.setAttribute('aria-expanded','false');}
function openWeekpick(){weekpick.classList.add('open');weekpickList.hidden=false;
  weekpickBtn.setAttribute('aria-expanded','true');
  const sel=weekpickList.querySelector('[aria-selected="true"]');if(sel)sel.focus();}
weekpickBtn.onclick=()=>{weekpickList.hidden?openWeekpick():closeWeekpick();};
document.addEventListener('click',e=>{if(!weekpick.contains(e.target))closeWeekpick();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!weekpickList.hidden){
  closeWeekpick();weekpickBtn.focus();}});
function renderWeekpick(){wpCur.textContent=WEEKS[curWeek].label;weekpickList.innerHTML='';
  WEEKS.forEach((wk,i)=>{const o=document.createElement('button');
    o.type='button';o.className='wp-opt';o.setAttribute('role','option');
    o.setAttribute('aria-selected',i===curWeek?'true':'false');
    o.innerHTML=`<span class="n">${wk.label}</span><span class="r">${wk.range}</span>`;
    o.onclick=()=>{curWeek=i;curDay=0;closeWeekpick();renderAll();weekpickBtn.focus();};
    weekpickList.appendChild(o);});}
function renderTabs(){tabsEl.innerHTML='';
  WEEKS[curWeek].days.forEach((d,i)=>{const t=document.createElement('div');
    t.className='tab'+(i===curDay?' active':'')+(d.date===todayISO?' is-today':'');
    t.innerHTML=`<div class="dow">${d.dow}</div><div class="ddate">${d.ddate}</div>`;
    t.onclick=()=>{curDay=i;renderTabs();renderPanel();};tabsEl.appendChild(t);});}
function renderPanel(){const d=WEEKS[curWeek].days[curDay];
  panelsEl.innerHTML=`<div class="cols">
    <div class="building"><div class="building-head"><h2>20층 구내식당</h2>
      <span class="tag">${d.f20.special?d.f20.special.label:(d.f20.holiday?'휴무':'한식 · 일품')}</span></div>${f20Block(d.f20,d.date)}</div>
    <div class="building"><div class="building-head"><h2>10층 공존</h2>
      <span class="tag">${d.f10&&d.f10.holiday?'휴무':'한정 수량'}</span></div>${f10Block(d.f10,d.date)}</div>
  </div>`;
  hydrateReactions();}
panelsEl.addEventListener('click',async e=>{
  const btn=e.target.closest('.rx');if(!btn||btn.disabled)return;
  const bar=btn.closest('.reactions'),id=btn.dataset.emoji;
  const st=bar._rx||{counts:{},mine:null};
  const to=st.mine===id?null:id;
  const next={counts:Object.assign({},st.counts),mine:to};
  if(st.mine)next.counts[st.mine]=Math.max(0,(next.counts[st.mine]||0)-1);
  if(to)next.counts[to]=(next.counts[to]||0)+1;
  rxPaint(bar,next);
  bar.querySelectorAll('.rx').forEach(b=>b.disabled=true);
  try{await rxStore().vote(bar.dataset.rxkey,to);rxPaint(bar,next);}
  catch(err){rxPaint(bar,st);rxNote(bar,RX_MSG.saveFail);}});
function renderAll(){rangePill.innerHTML='기간 <b>'+WEEKS[curWeek].range+'</b>';
  renderWeekpick();renderTabs();renderPanel();}
if(!rxShared()){const n=document.getElementById('rxModeNote');
  n.textContent='※ '+RX_MSG.localOnly;n.hidden=false;}
renderAll();
</script>
